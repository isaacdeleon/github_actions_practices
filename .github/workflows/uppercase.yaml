name: Ejemplo de Workflow con Parámetros

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      version:
        description: 'Versión de la aplicación'
        required: false
        type: string
        default: '1.0.0'
      force-deploy:
        description: 'Forzar despliegue (true/false)'
        required: false
        type: boolean
        default: false

jobs:
  deploy-job:
    runs-on: ubuntu-latest
    steps: 
      - name: Mostrar parámetros
        if: ${{ github.event.inputs.environment == 'PROD' }}
        run: |
          echo "Entorno seleccionado: ${{ github.event.inputs.environment }}"
          echo "Versión: ${{ github.event.inputs.version }}"
          echo "Forzar despliegue: ${{ github.event.inputs.force-deploy }}"
